[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["npm install -g corepack@latest", "corepack enable", "corepack prepare pnpm@10.17.1 --activate"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "node ./dist/server/entry.mjs"

[variables]
HOST = "0.0.0.0"
PORT = "4321"
# DEUDA DE SEGURIDAD: NODE_TLS_REJECT_UNAUTHORIZED=0 deshabilita verificación TLS.
# Eliminar cuando el servidor de Kommo tenga certificado válido configurado.
NODE_TLS_REJECT_UNAUTHORIZED = "0"
